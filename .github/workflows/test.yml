name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.local"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest openai networkx choix pandas httpx

      - name: Run tests
        run: >-
          python -m pytest
          core/checkpoint
          neurooracle/tests
          core/skill_loader
          core/session
          core/subagent
          skills/method-design/scripts

  model-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest numpy pandas scipy scikit-learn statsmodels torch-geometric

      - name: Run model tests
        run: python -m pytest models/tests
