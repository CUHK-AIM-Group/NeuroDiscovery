name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {layer: runtime, python: "3.10"}
          - {layer: runtime, python: "3.11"}
          - {layer: runtime, python: "3.12"}
          - {layer: graph, python: "3.11"}
          - {layer: models, python: "3.11"}
          - {layer: benchmark, python: "3.11"}
    name: ${{ matrix.layer }} / Python ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.local"
      - name: Install CPU Torch for scientific tests
        if: matrix.layer == 'models' || matrix.layer == 'graph'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install declared dependencies
        run: python -m pip install -e ".[test-${{ matrix.layer }}]"
      - name: Run shared test scope
        run: python -m pytest --layer ${{ matrix.layer }}

  windows-storage-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install declared dependencies
        run: python -m pip install -e ".[test]"
      - name: Test Windows NTFS compression and storage guards
        run: python -m pytest neurooracle/tests/test_kg_backup_storage.py
