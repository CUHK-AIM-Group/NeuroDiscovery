name: Tests

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Configure git
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@test.local"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest openai anthropic networkx choix pandas httpx requests ijson fastapi uvicorn

      - name: Run tests
        run: >-
          python -m pytest
          core/checkpoint
          neurooracle/tests
          core/skill_loader
          core/session
          core/subagent
          core/llm/tests
          core/web/test_hypothesis_controls.py
          core/web/test_workspace_theme.py
          core/web/test_oracle_workspace.py
          core/web/test_workbench.py
          core/web/test_autoresearch_help.py
          core/web/test_autoresearch_execution.py
          core/agent/test_autoresearch_execution.py
          core/agent/test_reflexion.py
          core/memory/test_memory.py
          core/test_autoresearch.py
          desktop/tests/test_runtime_packaging.py
          desktop/tests/test_ollama_credentials.py
          desktop/tests/test_model_library.py
          desktop/tests/test_settings_restart.py
          desktop/tests/test_window_chrome.py
          skills/method-design/scripts

  windows-storage-tests:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install storage test dependencies
        run: python -m pip install pytest networkx

      - name: Test Windows NTFS compression and storage guards
        run: python -m pytest neurooracle/tests/test_kg_backup_storage.py

  model-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install pytest numpy pandas scipy scikit-learn statsmodels torch-geometric nibabel matplotlib SimpleITK

      - name: Run model tests
        run: python -m pytest models/tests
