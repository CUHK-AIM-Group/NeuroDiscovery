<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="graph-title graph-description">
    <title id="graph-title">小脑—默认模式网络与注意症状：主题证据子图</title>
