    <metadata>{&quot;demo&quot;:true,&quot;scientific_validation&quot;:false,&quot;rendering&quot;:&quot;evidence-map-v2&quot;,&quot;nodes&quot;:[{&quot;id&quot;:&quot;adhd&quot;,&quot;name&quot;:&quot;ADHD&quot;},{&quot;id&quot;:&quot;cerebellum&quot;,&quot;name&quot;:&quot;小脑&quot;},{&quot;id&quot;:&quot;dmn&quot;,&quot;name&quot;:&quot;默认模式网络&quot;},{&quot;id&quot;:&quot;attention&quot;,&quot;name&quot;:&quot;注意症状&quot;},{&quot;id&quot;:&quot;motion&quot;,&quot;name&quot;:&quot;头动 / 站点&quot;},{&quot;id&quot;:&quot;t1&quot;,&quot;name&quot;:&quot;T1 灰质体积&quot;}],&quot;edges&quot;:[[&quot;adhd&quot;,&quot;cerebellum&quot;,&quot;共现线索&quot;],[&quot;cerebellum&quot;,&quot;dmn&quot;,&quot;连接候选&quot;],[&quot;dmn&quot;,&quot;attention&quot;,&quot;待验证关联&quot;],[&quot;motion&quot;,&quot;dmn&quot;,&quot;混杂控制&quot;],[&quot;t1&quot;,&quot;cerebellum&quot;,&quot;多模态补充&quot;],[&quot;adhd&quot;,&quot;attention&quot;,&quot;表型&quot;]]}</metadata>
